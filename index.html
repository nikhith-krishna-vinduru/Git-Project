<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101326">
  <meta name="description" content="A little hello from the internet.">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101326;
      color: #f7f5ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(94, 75, 235, .28), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgba(22, 196, 190, .17), transparent 36%),
        #101326;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      width: 24rem;
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 50%;
      pointer-events: none;
    }

    body::before { top: -13rem; right: -6rem; box-shadow: 0 0 0 3rem rgba(255,255,255,.018), 0 0 0 6rem rgba(255,255,255,.014); }
    body::after { bottom: -18rem; left: -10rem; width: 34rem; box-shadow: 0 0 0 4rem rgba(255,255,255,.018), 0 0 0 8rem rgba(255,255,255,.014); }

    main {
      position: relative;
      width: min(680px, calc(100% - 2rem));
      padding: clamp(2.25rem, 7vw, 4.5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 30px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .sparkle {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin: 0 auto 1.75rem;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 22px;
      background: linear-gradient(135deg, #a78bfa, #66e3d0);
      color: #15152b;
      font-size: 2rem;
      box-shadow: 0 12px 36px rgba(126, 105, 255, .3);
      transform: rotate(-7deg);
    }

    .eyebrow {
      margin: 0 0 .85rem;
      color: #a9a7c7;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.2rem);
      line-height: .98;
      letter-spacing: -.075em;
      background: linear-gradient(100deg, #fff 15%, #c5b5ff 55%, #83efe0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .message {
      max-width: 27rem;
      margin: 1.35rem auto 0;
      color: #c2c1d5;
      font-size: clamp(1rem, 2.6vw, 1.15rem);
      line-height: 1.7;
    }

    .rule {
      width: 3.5rem;
      height: 3px;
      margin: 2rem auto 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #a78bfa, #66e3d0);
    }

    nav { display: flex; justify-content: center; gap: .75rem; margin-top: 2rem; flex-wrap: wrap; }
    nav a { color: #e5e1ff; text-decoration: none; font-size: .9rem; padding: .65rem 1rem; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(255,255,255,.045); transition: background .2s, transform .2s; }
    nav a:hover, nav a:focus-visible { background: rgba(167,139,250,.2); transform: translateY(-2px); }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A small beginning</p>
    <h1>Hello,<br>World!</h1>
    <p class="message">A little bit of wonder, a fresh page, and a whole world of possibility.</p>
    <div class="rule" aria-hidden="true"></div>
    <nav aria-label="Main navigation">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </main>
</body>
</html>
