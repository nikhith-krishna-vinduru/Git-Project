<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101326">
  <meta name="description" content="A little about this small corner of the web.">
  <title>About · Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101326; color: #f7f5ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem 1rem; background: radial-gradient(ellipse at 18% 18%, rgba(94,75,235,.28), transparent 38%), radial-gradient(ellipse at 82% 78%, rgba(22,196,190,.17), transparent 36%), #101326; }
    main { width: min(680px, 100%); padding: clamp(2rem, 7vw, 4rem); text-align: center; border: 1px solid rgba(255,255,255,.14); border-radius: 28px; background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035)); box-shadow: 0 30px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12); backdrop-filter: blur(18px); animation: arrive .7s ease both; }
    .icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 1.5rem; border-radius: 20px; background: linear-gradient(135deg,#a78bfa,#66e3d0); color: #15152b; font-size: 1.7rem; }
    .eyebrow { margin: 0 0 .8rem; color: #a9a7c7; font-size: .75rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.8rem, 9vw, 5rem); line-height: 1; letter-spacing: -.07em; background: linear-gradient(100deg,#fff 15%,#c5b5ff 55%,#83efe0); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .copy { max-width: 34rem; margin: 1.4rem auto 0; color: #c2c1d5; font-size: 1.08rem; line-height: 1.8; }
    nav { display: flex; justify-content: center; gap: .75rem; margin-top: 2rem; flex-wrap: wrap; }
    nav a { color: #e5e1ff; text-decoration: none; font-size: .9rem; padding: .65rem 1rem; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(255,255,255,.045); transition: background .2s, transform .2s; }
    nav a:hover, nav a:focus-visible { background: rgba(167,139,250,.2); transform: translateY(-2px); }
    nav a[aria-current="page"] { background: rgba(167,139,250,.18); border-color: rgba(167,139,250,.42); }
    @keyframes arrive { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">✧</div>
    <p class="eyebrow">The story so far</p>
    <h1>About</h1>
    <p class="copy">Every great idea starts somewhere. This little corner of the web began with two words and a blank page—and grew into a place to share, explore, and make something new.</p>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html" aria-current="page">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </main>
</body>
</html>
